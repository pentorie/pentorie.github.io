<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#62416f">
  <title>Сила Сибири · Церемония открытия</title>
  <link rel="stylesheet" href="assets/screens.css">
</head>
<body data-screen="2">
  <main class="screen-shell hero-screen opening-screen">
    <section class="hero-partner-strip" aria-label="Партнёры соревнований">
      <div class="hero-partner-card" data-logo="minsport"><img src="assets/logos/minsport.svg" alt="Министерство спорта Российской Федерации"></div>
      <div class="hero-partner-card" data-logo="olympic"><img src="assets/logos/olympic.svg" alt="Олимпийский комитет России"></div>
      <div class="hero-partner-card" data-logo="federation"><img src="assets/logos/judo-federation.svg" alt="Федерация дзюдо России"></div>
      <div class="hero-partner-card" data-logo="gazprom"><img src="assets/logos/gazprom.svg" alt="Газпром трансгаз Томск"></div>
      <div class="hero-partner-card" data-logo="department"><img src="assets/logos/sport-department.svg" alt="Департамент спорта Томской области"></div>
      <div class="hero-partner-card" data-logo="latat"><img src="assets/logos/latat.svg" alt="LATAT"></div>
    </section>

    <section class="hero-sila-group" aria-label="Сила Сибири">
      <img class="hero-sila-combined" src="assets/logos/sila-combined.svg" alt="Сила Сибири">
    </section>

    <img class="hero-judo-logo" src="assets/logos/judo.svg" alt="Дзюдо">
    <h1 class="hero-copy ceremony-heading">Торжественная церемония открытия<br>всероссийских соревнований</h1>
  </main>
  <script src="assets/shared.js"></script>
</body>
</html>
