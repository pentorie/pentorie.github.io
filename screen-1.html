<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#06111e">
  <title>Сила Сибири · Основной экран</title>
  <link rel="stylesheet" href="assets/screens.css">
</head>
<body data-screen="1">
  <main class="screen-shell intro-screen">
    <p class="eyebrow">Всероссийские соревнования · Томск</p>
    <img class="competition-title" src="assets/logos/sila-text.svg" alt="Сила Сибири">

    <section class="partner-zone" aria-label="Генеральные партнёры">
      <div class="partner-list">
        <div class="partner-pill" data-logo="minsport"><img src="assets/logos/minsport.svg" alt="Министерство спорта Российской Федерации"></div>
        <div class="partner-pill" data-logo="federation"><img src="assets/logos/judo-federation.svg" alt="Федерация дзюдо России"></div>
        <div class="partner-pill" data-logo="gazprom"><img src="assets/logos/gazprom.svg" alt="Газпром трансгаз Томск"></div>
        <div class="partner-pill" data-logo="department"><img src="assets/logos/sport-department.svg" alt="Департамент спорта Томской области"></div>
        <div class="partner-pill" data-logo="latat"><img src="assets/logos/latat.svg" alt="LATAT"></div>
      </div>
    </section>

    <p class="event-description">Всероссийские соревнования по дзюдо<br>на призы «Газпром трансгаз Томск»</p>

    <div class="logo-switch" aria-label="Логотипы Дзюдо и Сила Сибири">
      <img class="swap-logo judo" src="assets/logos/judo.svg" alt="Дзюдо">
      <img class="swap-logo sila" src="assets/logos/sila-mark.svg" alt="Сила Сибири">
    </div>
  </main>
  <script src="assets/shared.js"></script>
</body>
</html>
