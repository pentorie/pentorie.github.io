<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D-анимация «Сила Сибири»</title>
    <style>
      :root {
        --logo-thickness: 16px;
        --turn-duration: 5.8s;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }

      body {
        overflow: hidden;
        background: #050b16;
      }

      .stage {
        position: relative;
        display: grid;
        min-height: 100svh;
        place-items: center;
        overflow: hidden;
        isolation: isolate;
        background:
          radial-gradient(circle at 50% 48%, rgba(33, 82, 156, 0.22), transparent 38%),
          linear-gradient(145deg, #07111f 0%, #03070f 68%, #06101e 100%);
      }

      .stage::before {
        position: absolute;
        z-index: -2;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.022) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
        background-size: 56px 56px;
        content: "";
        mask-image: radial-gradient(circle at center, black, transparent 73%);
      }

      .ambient {
        position: absolute;
        z-index: -1;
        width: min(42vw, 640px);
        aspect-ratio: 1;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.17;
      }

      .ambient-left { top: -22%; left: -10%; background: #1f69d5; }
      .ambient-right { right: -14%; bottom: -28%; background: #5f8ad7; }

      .scene {
        position: relative;
        width: min(66vw, 66svh, 680px);
        aspect-ratio: 3595.16 / 3389.46;
        perspective: 1450px;
        perspective-origin: 50% 48%;
      }

      .scene::after {
        position: absolute;
        z-index: -1;
        right: 15%;
        bottom: -10%;
        left: 15%;
        height: 10%;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.7);
        content: "";
        filter: blur(22px);
        opacity: 0.55;
      }

      .logo-3d {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        transform-origin: 50% 50%;
        animation: logo-turn var(--turn-duration) cubic-bezier(0.58, 0, 0.22, 1) infinite;
        will-change: transform;
      }

      .edge-layer,
      .logo-face {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .edge-layer {
        background: linear-gradient(115deg, #6f8fc3 0%, #315b99 42%, #183662 100%);
        backface-visibility: hidden;
        mask: url("./sila-sibiri.svg") center / contain no-repeat;
      }

      .edge-layer-front {
        transform: translateZ(var(--layer-z));
      }

      .edge-layer-back {
        transform: rotateY(180deg) translateZ(var(--back-layer-z));
      }

      .logo-face {
        display: block;
        object-fit: contain;
        backface-visibility: hidden;
        filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.22));
        user-select: none;
        -webkit-user-drag: none;
      }

      .logo-front { transform: translateZ(calc(var(--logo-thickness) + 0.3px)); }
      .logo-back { transform: rotateY(180deg) translateZ(calc(var(--logo-thickness) + 0.3px)); }

      @keyframes logo-turn {
        0%, 9% { transform: rotateY(0deg); }
        72%, 100% { transform: rotateY(360deg); }
      }

      @media (max-width: 720px) {
        .scene { width: min(78vw, 58svh); perspective: 1100px; }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="ambient ambient-left" aria-hidden="true"></div>
      <div class="ambient ambient-right" aria-hidden="true"></div>
      <section class="scene" aria-label="Вращающийся логотип «Сила Сибири»">
        <div class="logo-3d" id="logo-3d">
          <img class="logo-face logo-front" src="./sila-sibiri.svg" alt="Сила Сибири" />
          <img class="logo-face logo-back" src="./sila-sibiri.svg" alt="" aria-hidden="true" />
        </div>
      </section>
    </main>

    <script>
      const logo = document.querySelector("#logo-3d");
      const frontFace = logo.querySelector(".logo-front");
      const layers = document.createDocumentFragment();

      for (let z = -16; z <= 16; z += 1) {
        const frontLayer = document.createElement("span");
        frontLayer.className = "edge-layer edge-layer-front";
        frontLayer.style.setProperty("--layer-z", `${z}px`);
        frontLayer.setAttribute("aria-hidden", "true");
        layers.appendChild(frontLayer);

        const backLayer = document.createElement("span");
        backLayer.className = "edge-layer edge-layer-back";
        backLayer.style.setProperty("--back-layer-z", `${-z}px`);
        backLayer.setAttribute("aria-hidden", "true");
        layers.appendChild(backLayer);
      }

      logo.insertBefore(layers, frontFace);
    </script>
  </body>
</html>
